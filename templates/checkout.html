<!DOCTYPE html>
<html lang="{{ g.locale }}">
<head>
    <meta charset="UTF-8">
    <title>{{ _("To‘lov") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background: #f9fafb; margin: 0; padding: 0; }
        .checkout-box { max-width: 500px; margin: 30px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; }
        .readonly { background: #f3f4f6; }
        .copy-btn { background: #3b82f6; color: white; border: none; padding: 8px 12px; margin-left: 8px; border-radius: 6px; cursor: pointer; }
        .copy-btn:hover { background: #2563eb; }
        button.submit-btn { width: 100%; margin-top: 20px; padding: 12px; background: #22c55e; border: none; color: white; font-size: 16px; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="checkout-box">
        <h2>🛒 {{ _("Buyurtma to‘lovi") }}</h2>

        {% if error %}
        <div style="background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center; font-weight: 500;">
            {{ error }}
        </div>
        {% endif %}

        <!-- Jami summa -->
        <label>{{ _("Jami summa") }}</label>
        <input type="text" class="readonly" value="{{ total }} {{ _('so‘m') }}" readonly>

        <!-- Yetkazib berish ma'lumotlari -->
        <form action="{{ url_for('checkout') }}" method="post" enctype="multipart/form-data" id="checkout-form">
            <input type="hidden" name="tg_id" value="{{ session.get('tg_id') }}">

            <h3 style="margin-top: 20px; font-size: 17px;">📍 {{ _("Yetkazib berish ma'lumotlari") }}</h3>

            <label>{{ _("Qabul qiluvchi telefon raqami *") }}</label>
            <input type="text" name="phone" value="{{ user['phone'] if user and user['phone'] else '' }}" placeholder="+998901234567" required>

            <label>{{ _("Yetkazib berish manzili *") }}</label>
            <input type="text" name="address" value="{{ user['address'] if user and user['address'] else '' }}" placeholder="{{ _('Shahar, ko‘cha, uy raqami, mo‘ljal') }}" required>

            <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" name="save_address" id="save_address" value="1" checked style="width: auto; margin: 0;">
                <label for="save_address" style="margin: 0; font-weight: normal; font-size: 13px; color: #4b5563; cursor: pointer;">
                    {{ _("Kelgusi buyurtmalar uchun manzilni yangilab saqlash") }}
                </label>
            </div>

            <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">

            <!-- To‘lov ma'lumotlari -->
            <h3 style="font-size: 17px;">💳 {{ _("To‘lov ma'lumotlari") }}</h3>

            <label>{{ _("Karta raqami") }}</label>
            <div style="display:flex; align-items:center;">
                <input type="text" id="card-number" class="readonly" value="{{ card_number }}" readonly>
                <button type="button" class="copy-btn" onclick="copyCard()">📋 {{ _('Nusxa olish') }}</button>
            </div>
            <small style="color: #6b7280;">{{ _("Karta raqamini Payme yoki Click ilovasiga nusxa oling") }}</small>

            <label>{{ _("Karta egasi") }}</label>
            <input type="text" class="readonly" value="{{ card_owner }}" readonly>

            <!-- To‘lov cheki -->
            <label style="margin-top: 15px;">{{ _("To‘lov chekini yuklash *") }}</label>
            <input type="file" name="receipt" id="receipt-input" accept="image/*" required>

            <button type="submit" id="submit-btn" class="submit-btn" disabled>✅ {{ _("Buyurtmani jo‘natish") }}</button>
        </form>
    </div>

    <script>
        // Copy karta raqami
        function copyCard() {
            const cardInput = document.getElementById("card-number");
            cardInput.select();
            cardInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(cardInput.value);
            alert("💳 {{ _('Karta raqami nusxalandi!') }}");
        }

        // Chek majburiy
        const receiptInput = document.getElementById("receipt-input");
        const submitBtn = document.getElementById("submit-btn");

        receiptInput.addEventListener("change", function() {
            submitBtn.disabled = !this.files.length;
        });
    </script>
</body>
</html>
