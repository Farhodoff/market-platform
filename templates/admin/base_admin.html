<!DOCTYPE html>
<html lang="{{ g.get('locale', 'uz') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ _("Admin Panel") }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      body {
          background: #f5f6fa;
          font-family: 'Segoe UI', sans-serif;
      }
      .sidebar {
          width: 250px;
          background: #fff;
          height: 100vh;
          position: fixed;
          left: 0;
          top: 0;
          padding: 20px;
          box-shadow: 2px 0 6px rgba(0,0,0,0.1);
      }
      .sidebar h2 {
          font-size: 20px;
          font-weight: 700;
          margin-bottom: 30px;
      }
      .sidebar a {
          display: block;
          padding: 12px 15px;
          margin-bottom: 10px;
          border-radius: 8px;
          text-decoration: none;
          color: #333;
          transition: all 0.2s;
      }
      .sidebar a:hover, .sidebar a.active {
          background: #007bff;
          color: #fff;
      }
      .logout {
          background: #fee2e2;
          color: #dc2626;
          margin-top: 50px;
      }
      .main {
          margin-left: 270px;
          padding: 30px;
      }
      .topbar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
      }
      .content {
          background: #fff;
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      }
  </style>
</head>
<body>

<div class="admin-wrapper d-flex">
    <!-- Sidebar -->
    <div class="sidebar">
        <h2>⚙️ {{ _("Admin Panel") }}</h2>
        <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">📊 {{ _("Dashboard") }}</a>
        <a href="{{ url_for('admin_products') }}" class="{% if request.endpoint == 'admin_products' %}active{% endif %}">📦 {{ _("Mahsulotlar") }}</a>
        <a href="{{ url_for('admin_categories') }}" class="{% if request.endpoint == 'admin_categories' %}active{% endif %}">🗂 {{ _("Kategoriyalar") }}</a>
        <a href="{{ url_for('admin_orders') }}" class="{% if request.endpoint == 'admin_orders' %}active{% endif %}">🛒 {{ _("Buyurtmalar") }}</a>
        <a href="{{ url_for('admin_logout') }}" class="logout">🚪 {{ _("Chiqish") }}</a>
    </div>

    <!-- Main content -->
    <div class="main flex-fill">
        <div class="topbar">
            <h1>{% block title %}{% endblock %}</h1>
            <div class="d-flex align-items-center">
                <span>{{ _("Admin") }}</span>
            </div>
        </div>

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
