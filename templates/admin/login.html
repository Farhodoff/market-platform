<!DOCTYPE html>
<html lang="{{ g.locale }}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 {{ _("Admin Login") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #e0e7ff, #f9fafb);
            font-family: "Poppins", Arial, sans-serif;
            margin: 0;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 15%, rgba(67, 97, 238, 0.2), transparent 28%),
                radial-gradient(circle at 85% 85%, rgba(58, 12, 163, 0.14), transparent 30%);
            pointer-events: none;
        }
        .login-box {
            position: relative;
            background: white;
            padding: 38px 32px 32px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(30, 41, 59, 0.14);
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.6s ease-in-out;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #111827;
            font-weight: 700;
            font-size: 22px;
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 15px;
        }
        .login-box .logo-mark {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            box-shadow: 0 10px 24px rgba(67, 97, 238, 0.3);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            margin-top: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }
        button:hover {
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            transform: translateY(-2px);
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            text-align: center;
            animation: shake 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95);}
            to { opacity: 1; transform: scale(1);}
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-2px); }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px 20px;
                width: 92%;
            }
            h2 {
                font-size: 19px;
            }
            input, button {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <div class="logo-mark"><i class="bi bi-shop"></i></div>
    </div>
    <h2>🔐 {{ _("Admin Panelga kirish") }}</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="👤 {{ _('Login') }}" required>
        <input type="password" name="password" placeholder="🔑 {{ _('Parol') }}" required>
        <button type="submit">➡️ {{ _('Kirish') }}</button>
    </form>
</div>
</body>
</html>
